[package]
name = "krun-rutabaga-gfx"
version = "0.1.0-2.0.0-dev"
authors = ["The libkrun Authors"]
edition = "2024"
description = "[highly unstable] Handling virtio-gpu protocols"
license-file = "LICENSE"
repository = "https://github.com/containers/libkrun"

[features]
gfxstream = []
gfxstream_stub = []
gpu = []
virgl_renderer = []
virgl_renderer_next = []
virgl_resource_map2 = []
minigbm = []
# To try out Vulkano, delete the following line and uncomment the line in "dependencies". Vulkano
# features are just a prototype and not integrated yet into the ChromeOS build system.
vulkano = []
x = []

[dependencies]
cfg-if = "1.0.0"
libc = "0.2.116"
remain = "0.2"
thiserror = "1.0.23"
zerocopy = { version = "0.8.26", features = ["derive"] }
log = "0.4"
vmm-sys-util = "0.15"

# The renderer itself, as a Rust crate rather than a dylib behind a C ABI: nothing chooses it at
# link time any more, because there is nothing left to choose.
#
# A path and not a git dependency, and that is forced rather than preferred: virglrs generates its
# format tables and its venus wire from a C tree its own scripts/vendor.sh materializes, and a
# cargo git checkout has no step that could run it. So the crate is vendored like every other
# fork — `cargo xtask vendor`, pinned in third_party/manifest.toml.
virglrenderer = { package = "virglrs", path = "../../../virglrs" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30.1", features = ["event", "feature", "fs", "mman", "socket", "uio", "ioctl"] }

[target.'cfg(windows)'.dependencies]
winapi = "0.3"

# To build latest Vulkano, change version to git = "https:/github.com/vulkano-rs/vulkano.git"
# vulkano = { version = "0.31.0", optional = true }

[build-dependencies]
pkg-config = "0.3"
anyhow = "1.0.57"
